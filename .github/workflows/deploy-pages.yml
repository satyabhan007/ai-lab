# Deploys the AI-ML GitHub Pages site from the repository root.
# Pages is auto-enabled by configure-pages (enablement: true) — no manual setup needed.
# Your site will be live at: https://<username>.github.io/<repo>/

name: Deploy AI-ML to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (source: "GitHub Actions") so the first deploy
          # works without manually flipping Settings → Pages.
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4